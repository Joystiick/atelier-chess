# Atelier Chess — desktop installers (Electron)
# Working directory: desktop/  |  Targets: Win x64 NSIS + macOS universal DMG (no Win x86)
#
# Triggers:
#   - push tags matching desktop-v*  → build, electron-builder --publish always, update latest.json
#   - workflow_dispatch              → build + upload artifacts only (no release / no latest.json commit)
#
# Required for publish (provided by Actions — do not invent or commit values):
#   GITHUB_TOKEN  — contents:write is enough for GitHub Releases + committing latest.json
#   (alias: set GH_TOKEN repo secret to a PAT if you need cross-repo or elevated publish)
#
# Optional code signing / notarization (leave unset for unsigned beta):
#   CSC_LINK                  — base64 of .pfx (Windows) or .p12 (macOS)
#   CSC_KEY_PASSWORD          — certificate password
#   APPLE_ID                  — Apple ID for notarization
#   APPLE_APP_SPECIFIC_PASSWORD
#   APPLE_TEAM_ID
#
name: Desktop Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  # Prefer optional GH_TOKEN PAT secret; otherwise the job token (needs contents:write).
  GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            eb_args: --win --x64
            dist_script: dist:win
            artifact_name: desktop-windows-x64
          - os: macos-latest
            eb_args: --mac --universal
            dist_script: dist:mac
            artifact_name: desktop-macos-universal

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Tag must be desktop-vSEMVER (got: ${GITHUB_REF_NAME})"
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "DESKTOP_VERSION=$VERSION" >> "$GITHUB_ENV"

      # Unsigned builds are OK when signing secrets are unset (electron-builder skips).
      - name: Build installers (no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run ${{ matrix.dist_script }}

      - name: Build and publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run build
          npx electron-builder ${{ matrix.eb_args }} --publish always

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.yml
            desktop/release/*.blockmap
            desktop/release/*.json
          if-no-files-found: error
          retention-days: 14

  update-latest:
    name: Update public/desktop/latest.json
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download release installers
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          WIN="AtelierChess-Setup-${VERSION}-x64.exe"
          MAC="AtelierChess-${VERSION}-mac.dmg"
          mkdir -p desktop/release

          # Matrix publishes can race; retry until both assets are on the Release.
          for attempt in $(seq 1 18); do
            echo "Attempt ${attempt}: listing release ${GITHUB_REF_NAME}"
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release download "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" \
                --dir desktop/release \
                --pattern "$WIN" \
                --pattern "$MAC" \
                --clobber || true
              if [[ -f "desktop/release/$WIN" && -f "desktop/release/$MAC" ]]; then
                ls -la desktop/release
                exit 0
              fi
            fi
            echo "Waiting for Win NSIS + Mac DMG on release…"
            sleep 10
          done
          echo "::error::Timed out waiting for $WIN and $MAC on release $GITHUB_REF_NAME"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" || true
          exit 1

      - name: Write latest.json
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          node desktop/scripts/write-latest-json.mjs \
            --version "$VERSION" \
            --tag "$GITHUB_REF_NAME" \
            --dir desktop/release \
            --out public/desktop/latest.json \
            --repo "${{ github.repository }}" \
            --notes "Desktop client ${VERSION}" \
            --require-files

      - name: Commit latest.json to default branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/desktop/latest.json
          if git diff --staged --quiet; then
            echo "latest.json already up to date — nothing to commit"
            exit 0
          fi
          git commit -m "chore(desktop): update latest.json for ${GITHUB_REF_NAME}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
