# Atelier Chess — desktop installers (Electron)
# Win x64 NSIS + macOS universal DMG. No Win x86.
#
# Tags: desktop-v* → build → GitHub Release assets → update public/desktop/latest.json
# workflow_dispatch → build + artifacts only
#
name: Desktop Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist_script: dist:win
            artifact_name: desktop-windows-x64
            artifact_glob: |
              desktop/release/*.exe
              desktop/release/*.blockmap
              desktop/release/*.yml
          - os: macos-latest
            dist_script: dist:mac
            artifact_name: desktop-macos-universal
            artifact_glob: |
              desktop/release/*.dmg
              desktop/release/*.zip
              desktop/release/*.blockmap
              desktop/release/*.yml

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Tag must be desktop-vSEMVER (got: ${GITHUB_REF_NAME})"
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "DESKTOP_VERSION=$VERSION" >> "$GITHUB_ENV"

      # Do NOT pass empty CSC_* secrets — electron-builder treats "" as a cert path.
      # Unsigned beta: force skip identity discovery.
      - name: Build installers (unsigned / publish never)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run ${{ matrix.dist_script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows-x64
          path: desktop/release

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-macos-universal
          path: desktop/release

      - name: Create or update release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          TAG="$GITHUB_REF_NAME"
          WIN="AtelierChess-Setup-${VERSION}-x64.exe"
          MAC="AtelierChess-${VERSION}-mac.dmg"

          ls -la desktop/release

          if [[ ! -f "desktop/release/$WIN" ]]; then
            echo "::error::Missing $WIN"
            exit 1
          fi
          if [[ ! -f "desktop/release/$MAC" ]]; then
            echo "::error::Missing $MAC"
            # Some builders emit arch in the name — accept universal fallback
            ALT=$(ls desktop/release/AtelierChess-${VERSION}-mac*.dmg 2>/dev/null | head -n1 || true)
            if [[ -n "$ALT" ]]; then
              cp "$ALT" "desktop/release/$MAC"
            else
              exit 1
            fi
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading assets"
            gh release upload "$TAG" \
              "desktop/release/$WIN" \
              "desktop/release/$MAC" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            echo "Creating release $TAG"
            gh release create "$TAG" \
              "desktop/release/$WIN" \
              "desktop/release/$MAC" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Atelier Chess Desktop ${VERSION}" \
              --notes "Desktop client ${VERSION} — Windows x64 NSIS and macOS universal DMG. Cloud multiplayer via atelierchess.netlify.app."
          fi

  update-latest:
    name: Update public/desktop/latest.json
    needs: release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download release installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          WIN="AtelierChess-Setup-${VERSION}-x64.exe"
          MAC="AtelierChess-${VERSION}-mac.dmg"
          mkdir -p desktop/release
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir desktop/release \
            --pattern "$WIN" \
            --pattern "$MAC" \
            --clobber
          ls -la desktop/release

      - name: Write latest.json
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          node desktop/scripts/write-latest-json.mjs \
            --version "$VERSION" \
            --tag "$GITHUB_REF_NAME" \
            --dir desktop/release \
            --out public/desktop/latest.json \
            --repo "${{ github.repository }}" \
            --notes "Desktop client ${VERSION}" \
            --require-files

      - name: Commit latest.json to default branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/desktop/latest.json
          if git diff --staged --quiet; then
            echo "latest.json already up to date"
            exit 0
          fi
          git commit -m "chore(desktop): update latest.json for ${GITHUB_REF_NAME}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
