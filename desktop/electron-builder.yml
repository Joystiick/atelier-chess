appId: app.atelierchess.desktop
productName: Atelier Chess
copyright: Copyright © Atelier Chess

directories:
  output: release
  buildResources: build

files:
  - dist-electron/**/*
  - package.json

extraMetadata:
  main: dist-electron/main.js

asar: true

# Icon: build/icon.png (synced from ../public/icons/icon-512.png via scripts/sync-icon.mjs)
# electron-builder generates .ico / .icns from PNG on each platform.

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: AtelierChess-Setup-${version}-${arch}.${ext}
  # No ia32 / x86 — Chromium dropped 32-bit Windows.

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Atelier Chess
  uninstallDisplayName: Atelier Chess

mac:
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  category: public.app-category.games
  artifactName: AtelierChess-${version}-mac-${arch}.${ext}
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  artifactName: AtelierChess-${version}-mac.${ext}

linux:
  target: []

# Metadata for electron-updater. CI publishes with `gh release` + `--publish never`
# so the git tag stays `desktop-v*` (electron-builder would default to v$version).
publish:
  provider: github
  owner: Joystiick
  repo: atelier-chess
  releaseType: release
  vPrefixedTagName: false

protocols:
  - name: Atelier Chess
    schemes:
      - atelier
